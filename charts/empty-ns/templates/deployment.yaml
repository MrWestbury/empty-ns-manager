apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "empty-ns.fullname" . }}
  namespace: {{ .Release.namespace }}
  labels:
    {{- include "empty-ns.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      kubernetes.wifu.co.uk/app: {{ include "empty-ns.name" . }}
  template:
    metadata:
      labels:
        kubernetes.wifu.co.uk/app: {{ include "empty-ns.name" . }}
    spec:
      serviceAccount: {{ include "empty-ns.sa-name" . }}
      imagePullSecrets:
        - name: mortbury-acr
      containers:
      - name: empty-ns-cleaner
        image: "{{ .Values.image.repository}}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.imagePullPolicy }}
        
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
      restartPolicy: Always