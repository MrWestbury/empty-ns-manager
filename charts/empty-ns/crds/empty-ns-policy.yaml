apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: emptynspolicies.kubernetes.wifu.co.uk
spec:
  scope: Namespaced
  names:
    plural: emptynspolicies
    singular: emptynspolicy
    kind: EmptyNsPolicy
    shortNames:
      - ensp
  group: kubernetes.wifu.co.uk
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
              description: API version of the custom resource.
            kind:
              type: string
              description: Kind of the custom resource.
            metadata:
              type: object
            spec:
              type: object
              properties:
                namespaceSelector:
                  type: object
                  description: Selector to match namespaces.
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                policyAction:
                  type: string
                  description: Action to take on empty namespaces (e.g., "delete", "label").
                  enum:
                    - delete
                    - label
                message:
                  type: string
                  description: Optional message to log when action is taken.
              required:
                - namespaceSelector
                - policyAction
            status:
              type: object
              properties: {}
      subresources:
        status: {}
  